name: Package VARNIX Add-on

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          python - <<'PY'
          import json
          import pathlib
          for path in pathlib.Path(".").rglob("*.json"):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK:", path)
          for path in ["VARNIX_BP/manifest.json", "VARNIX_RP/manifest.json"]:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              assert data["format_version"] == 2
              assert data["header"]["min_engine_version"] == [1, 21, 51]
          assert pathlib.Path("VARNIX_RP/textures/items/pistol.png").is_file()
          assert pathlib.Path("VARNIX_RP/textures/items/gas_mask.png").is_file()
          print("Manifest and custom texture checks passed")
          PY
      - name: Check script syntax
        run: node --check VARNIX_BP/scripts/main.js
      - name: Package mcaddon
        run: |
          mkdir -p dist bundle
          (cd VARNIX_BP && zip -qr ../bundle/VARNIX_BP.mcpack .)
          (cd VARNIX_RP && zip -qr ../bundle/VARNIX_RP.mcpack .)
          (cd bundle && zip -qr ../dist/VARNIX_APOCALYPSE_LITE-dev.mcaddon .)
      - uses: actions/upload-artifact@v4
        with:
          name: VARNIX-APOCALYPSE-LITE-dev
          path: dist/VARNIX_APOCALYPSE_LITE-dev.mcaddon
          if-no-files-found: error
