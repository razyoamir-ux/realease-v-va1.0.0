name: Package VARNIX Add-on

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests
        run: |
          python - <<'PY'
          import json
          for path in ["VARNIX_BP/manifest.json", "VARNIX_RP/manifest.json"]:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              assert data["format_version"] == 2
              assert data["header"]["min_engine_version"] == [1, 21, 51]
              print("OK:", path)
          PY
      - name: Package mcaddon
        run: |
          mkdir -p dist bundle
          (cd VARNIX_BP && zip -qr ../bundle/VARNIX_BP.mcpack .)
          (cd VARNIX_RP && zip -qr ../bundle/VARNIX_RP.mcpack .)
          (cd bundle && zip -qr ../dist/VARNIX_APOCALYPSE_LITE-dev.mcaddon .)
      - uses: actions/upload-artifact@v4
        with:
          name: VARNIX-APOCALYPSE-LITE-dev
          path: dist/VARNIX_APOCALYPSE_LITE-dev.mcaddon
          if-no-files-found: error
